<title>서정현의 프로젝트와 기술 관계도</title>
<desc>CreditPulse, 말해봄 Mk.2, 보이스가드에서 쓴 기술을 프로젝트 색의 곡선으로 이은 관계도. 실선은 근거가 확인된 관계이고 점선은 검증이거나 공개 사본에서 실행한 기록이 없는 관계다. 평가·측정, pytest, FastAPI는 세 프로젝트가 함께 쓴다.</desc>
